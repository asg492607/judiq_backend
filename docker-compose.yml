version: '3.8'

services:
  # 1. JudiQ Backend API Cluster
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: judiq-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-judiq_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-judiq_db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in production}
      - DEBUG=${DEBUG:-False}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - judiq-network

  # 2. Production PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: judiq-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-judiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-judiq_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-judiq_user} -d ${POSTGRES_DB:-judiq_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - judiq-network

  # 3. High-Performance Redis Cache (used for rate limiting & future distributed WebSocket broker)
  redis:
    image: redis:7-alpine
    container_name: judiq-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - judiq-network

volumes:
  postgres_data:
  redis_data:

networks:
  judiq-network:
    driver: bridge
