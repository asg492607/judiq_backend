services:
  - type: web
    name: judiq-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # SECURITY: Set DATABASE_URL as a Render Secret in the dashboard, not here.
      # See: https://render.com/docs/environment-variables#secret-files
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: GDRIVE_FILE_ID
        value: 1DfejIbgRXco3Tpp_aTBfarIm7h3t32EVykJGkEFdee4
      - key: GDRIVE_API_KEY
        value: ""
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        value: ""
      - key: FIREBASE_PROJECT_ID
        value: idcourt-cb58f
      - key: FIREBASE_AUTH_DOMAIN
        value: idcourt-cb58f.firebaseapp.com
      - key: FIREBASE_APP_ID
        value: "1:941086914513:web:8edad96b7e9f0dd4be12f0"
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: "941086914513"
      - key: LOG_LEVEL
        value: WARNING
