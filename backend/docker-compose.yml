services:
  judiq-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: judiq-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - SECRET_KEY=${SECRET_KEY:-changeme_secure_key_for_dev_only}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-c2VjcmV0X2tleV90aGF0X2lzX2V4YWN0bHlfMzJfYnk=}
      - DEBUG=${DEBUG:-False}
    volumes:
      - ./uploads:/app/uploads
      - ./analytics.db:/app/analytics.db
    restart: unless-stopped

  judiq-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: judiq-frontend
    ports:
      - "8080:80"
    depends_on:
      - judiq-backend
    restart: unless-stopped
