name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'frontend/**'
      - 'build_apk.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Android Standalone APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Frontend Assets
        run: |
          python build_apk.py --prepare-only || python -c "
          import shutil, os
          dest = 'android/app/src/main/assets/frontend'
          os.makedirs(dest, exist_ok=True)
          shutil.copytree('frontend', dest, dirs_exist_ok=True)
          print('Copied frontend assets to Android package')
          "

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JudiQ_AI_Android_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
