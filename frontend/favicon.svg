<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Shield Outer Cyan Glow Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Golden Scales / Accents Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Pillar Cyan/Electric Blue Gradient -->
    <linearGradient id="pillarBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Pillar Core Highlight -->
    <linearGradient id="pillarCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Shield Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Gold Pan Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. SHIELD BASE CONTAINER WITH CYAN GLOW -->
  <g filter="url(#cyanGlow)">
    <!-- Outer Shield Contour -->
    <path d="M 256 42 
             C 324 42, 396 64, 424 94
             C 424 230, 394 360, 256 466
             C 118 360, 88 230, 88 94
             C 116 64, 188 42, 256 42 Z" 
          fill="url(#shieldBg)" 
          stroke="url(#shieldBorder)" 
          stroke-width="12" 
          stroke-linejoin="round"/>

    <!-- Inner Shield Inset Ring -->
    <path d="M 256 64 
             C 314 64, 376 84, 402 108
             C 402 222, 374 338, 256 436
             C 138 338, 110 222, 110 108
             C 136 84, 198 64, 256 64 Z" 
          fill="none" 
          stroke="#1E293B" 
          stroke-width="4" 
          stroke-opacity="0.8"/>
  </g>

  <!-- 2. SHIELD INNER ACCENT PANELS / FACETS -->
  <!-- Left Inner Wing Facet -->
  <path d="M 126 120 C 130 220, 160 310, 236 386 L 236 120 Z" 
        fill="#1E293B" fill-opacity="0.25"/>
  <!-- Right Inner Wing Facet -->
  <path d="M 386 120 C 382 220, 352 310, 276 386 L 276 120 Z" 
        fill="#0F172A" fill-opacity="0.4"/>

  <!-- 3. TOP CROWN / CAP OF PILLAR IN GOLD -->
  <path d="M 232 94 L 280 94 L 272 118 L 240 118 Z" 
        fill="url(#goldGradient)" stroke="#FDE047" stroke-width="2" stroke-linejoin="round"/>
  <rect x="244" y="80" width="24" height="14" rx="4" fill="url(#goldGradient)"/>

  <!-- 4. CENTRAL PILLAR / SWORD (ELECTRIC BLUE) -->
  <!-- Pillar Shadow/Base -->
  <rect x="236" y="118" width="40" height="236" rx="6" fill="#0369A1"/>
  <!-- Pillar Main Shaft -->
  <rect x="240" y="118" width="32" height="236" rx="5" fill="url(#pillarBlue)"/>
  <!-- Pillar Luminous Center Stripe -->
  <line x1="256" y1="126" x2="256" y2="344" stroke="url(#pillarCore)" stroke-width="6" stroke-linecap="round"/>

  <!-- Pillar Golden Intermediate Bands -->
  <!-- Upper Band -->
  <rect x="232" y="152" width="48" height="12" rx="3" fill="url(#goldGradient)" stroke="#FDE047" stroke-width="1.5"/>
  <circle cx="256" cy="158" r="3" fill="#0F172A"/>
  
  <!-- Middle Band / Crossbeam Anchor -->
  <rect x="230" y="214" width="52" height="14" rx="3" fill="url(#goldGradient)" stroke="#FDE047" stroke-width="1.5"/>
  <circle cx="256" cy="221" r="3.5" fill="#38BDF8"/>

  <!-- Lower Band -->
  <rect x="234" y="280" width="44" height="12" rx="3" fill="url(#goldGradient)" stroke="#FDE047" stroke-width="1.5"/>

  <!-- 5. HORIZONTAL BALANCE BEAM IN GOLD -->
  <path d="M 152 216 L 360 216" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="152" cy="216" r="6" fill="url(#goldGradient)"/>
  <circle cx="360" cy="216" r="6" fill="url(#goldGradient)"/>

  <!-- 6. LEFT SCALE OF JUSTICE -->
  <!-- Left Suspension Strings -->
  <line x1="152" y1="218" x2="124" y2="280" stroke="#FDE047" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="152" y1="218" x2="180" y2="280" stroke="#FDE047" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="152" y1="218" x2="152" y2="280" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Left Scale Pan -->
  <g filter="url(#goldGlow)">
    <path d="M 116 280 C 116 308, 188 308, 188 280 Z" 
          fill="url(#goldGradient)" 
          stroke="#FDE047" 
          stroke-width="3" 
          stroke-linejoin="round"/>
    <ellipse cx="152" cy="280" rx="36" ry="6" fill="#FDE047"/>
  </g>

  <!-- 7. RIGHT SCALE OF JUSTICE -->
  <!-- Right Suspension Strings -->
  <line x1="360" y1="218" x2="332" y2="280" stroke="#FDE047" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="360" y1="218" x2="388" y2="280" stroke="#FDE047" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="360" y1="218" x2="360" y2="280" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Right Scale Pan -->
  <g filter="url(#goldGlow)">
    <path d="M 324 280 C 324 308, 396 308, 396 280 Z" 
          fill="url(#goldGradient)" 
          stroke="#FDE047" 
          stroke-width="3" 
          stroke-linejoin="round"/>
    <ellipse cx="360" cy="280" rx="36" ry="6" fill="#FDE047"/>
  </g>

  <!-- 8. BOTTOM PILLAR BASE / PEDESTAL (GOLD & CYAN) -->
  <path d="M 216 354 L 296 354 L 284 374 L 228 374 Z" 
        fill="url(#goldGradient)" stroke="#FDE047" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bottom Taper Arrow / Point -->
  <polygon points="256,412 242,376 270,376" fill="url(#pillarBlue)" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- 9. TOP APEX JEWEL EMBLEM -->
  <circle cx="256" cy="56" r="4" fill="#38BDF8" filter="url(#cyanGlow)"/>
</svg>
