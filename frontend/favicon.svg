<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M32 4 C46 4 56 10 56 22 C56 42 42 55 32 60 C22 55 8 42 8 22 C8 10 18 4 32 4 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Subtle Border -->
  <path d="M32 8 C43 8 51 13 51 23 C51 39 39 50 32 54 C25 50 13 39 13 23 C13 13 21 8 32 8 Z" 
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Scales of Justice -->
  <!-- Central Pillar / Beam -->
  <rect x="30.5" y="16" width="3" height="26" rx="1.5" fill="url(#goldGrad)" />
  <!-- Base Pedestal -->
  <path d="M25 42 L39 42 L41 45 L23 45 Z" fill="url(#goldGrad)" />
  <!-- Central Finial / Balance Pivot -->
  <circle cx="32" cy="18" r="3" fill="url(#goldGrad)" filter="url(#glow)" />
  <!-- Horizontal Balance Beam -->
  <path d="M18 21 C24 19.5 40 19.5 46 21" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Scale Pan -->
  <line x1="19" y1="21" x2="15" y2="29" stroke="url(#goldGrad)" stroke-width="1.2" />
  <line x1="19" y1="21" x2="23" y2="29" stroke="url(#goldGrad)" stroke-width="1.2" />
  <path d="M13 29 Q19 35 25 29 Z" fill="url(#goldGrad)" opacity="0.95" />

  <!-- Right Scale Pan -->
  <line x1="45" y1="21" x2="41" y2="29" stroke="url(#goldGrad)" stroke-width="1.2" />
  <line x1="45" y1="21" x2="49" y2="29" stroke="url(#goldGrad)" stroke-width="1.2" />
  <path d="M39 29 Q45 35 51 29 Z" fill="url(#goldGrad)" opacity="0.95" />

  <!-- Tech Diamond Accent -->
  <polygon points="32,10 34,13 32,16 30,13" fill="url(#accentGlow)" />
</svg>
