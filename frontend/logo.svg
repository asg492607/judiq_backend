<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Frame -->
  <path d="M 256,24 L 436,84 V 244 C 436,356 352,448 256,488 C 160,448 76,356 76,244 V 84 Z" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#cyanGlow)"/>
  <path d="M 256,40 L 420,95 V 244 C 420,344 344,430 256,468 C 168,430 92,344 92,244 V 95 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Neural AI Nodes & Circuit Lines -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.5">
    <line x1="256" y1="120" x2="160" y2="190" />
    <line x1="256" y1="120" x2="352" y2="190" />
    <line x1="160" y1="190" x2="140" y2="300" />
    <line x1="352" y1="190" x2="372" y2="300" />
    <line x1="256" y1="120" x2="256" y2="380" />
  </g>
  <circle cx="160" cy="190" r="5" fill="#38bdf8" filter="url(#cyanGlow)"/>
  <circle cx="352" cy="190" r="5" fill="#38bdf8" filter="url(#cyanGlow)"/>
  <circle cx="256" cy="120" r="6" fill="#fbbf24" filter="url(#goldGlow)"/>

  <!-- Central Sword / Pillar of Justice -->
  <path d="M 251,100 L 261,100 L 258,370 L 254,370 Z" fill="url(#cyanGrad)" filter="url(#cyanGlow)"/>
  <!-- Hilt / Guard -->
  <path d="M 216,145 C 236,140 276,140 296,145 L 292,155 C 272,150 240,150 220,155 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>

  <!-- Balance Beam -->
  <path d="M 130,190 L 382,190" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" filter="url(#goldGlow)"/>

  <!-- Left Scale Pan -->
  <line x1="150" y1="190" x2="110" y2="280" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="150" y1="190" x2="190" y2="280" stroke="#f59e0b" stroke-width="2.5"/>
  <path d="M 95,280 C 95,315 205,315 205,280 Z" fill="url(#goldGrad)" opacity="0.85" filter="url(#goldGlow)"/>

  <!-- Right Scale Pan -->
  <line x1="362" y1="190" x2="322" y2="280" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="362" y1="190" x2="402" y2="280" stroke="#f59e0b" stroke-width="2.5"/>
  <path d="M 307,280 C 307,315 417,315 417,280 Z" fill="url(#goldGrad)" opacity="0.85" filter="url(#goldGlow)"/>

  <!-- Base Stand -->
  <path d="M 200,410 L 312,410 L 330,430 L 182,430 Z" fill="url(#goldGrad)"/>
  <circle cx="256" cy="385" r="14" fill="url(#cyanGrad)" filter="url(#cyanGlow)"/>

  <!-- Emblem Crown / Star -->
  <polygon points="256,52 263,70 282,70 266,81 272,99 256,88 240,99 246,81 230,70 249,70" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
</svg>
