<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Deep Royal Navy Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Vibrant Electric Blue to Cyan Gradient -->
    <linearGradient id="primaryBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Pure Platinum White Gradient -->
    <linearGradient id="pureWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Subtle Soft Shadow for Depth -->
    <filter id="softElevation" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.2"/>
    </filter>

    <!-- Subtle Outer Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Base Container: Premium Smooth Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#softElevation)"/>

  <!-- Geometric Emblem: Scales of Justice + J/Q Monogram in Pure White & Blue -->
  <g transform="translate(0, 0)">
    <!-- 1. Central Vertical Axis (Pillar of Law) -->
    <line x1="256" y1="124" x2="256" y2="348" stroke="url(#pureWhite)" stroke-width="8" stroke-linecap="round"/>

    <!-- 2. Horizontal Balance Beam (Upper Arch) -->
    <path d="M 132 196 C 168 168, 212 156, 256 156 C 300 156, 344 168, 380 196" 
          stroke="url(#pureWhite)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- 3. Left Balance Scale (White & Blue Geometry) -->
    <line x1="132" y1="196" x2="132" y2="246" stroke="url(#pureWhite)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 100 246 C 100 268, 164 268, 164 246 Z" 
          fill="none" stroke="url(#primaryBlue)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 102 246 C 102 265, 162 265, 162 246 Z" fill="url(#primaryBlue)" opacity="0.25"/>

    <!-- 4. Right Balance Scale (White & Blue Geometry) -->
    <line x1="380" y1="196" x2="380" y2="246" stroke="url(#pureWhite)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 348 246 C 348 268, 412 268, 412 246 Z" 
          fill="none" stroke="url(#primaryBlue)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 350 246 C 350 265, 410 265, 410 246 Z" fill="url(#primaryBlue)" opacity="0.25"/>

    <!-- 5. 'J' Curve Sweep at Base (White Graceful Loop) -->
    <path d="M 256 312 C 256 372, 192 384, 176 348 C 168 328, 180 308, 204 308 C 224 308, 236 322, 236 338" 
          stroke="url(#pureWhite)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- 6. 'Q' Tail Diagonal Slash (Electric Blue Precision Stroke) -->
    <path d="M 256 332 C 278 332, 318 344, 348 384" 
          stroke="url(#primaryBlue)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- 7. Base Foundation Arch (Crisp White Pedestal) -->
    <line x1="208" y1="400" x2="304" y2="400" stroke="url(#pureWhite)" stroke-width="6" stroke-linecap="round"/>

    <!-- 8. Apex Diamond Core (Wisdom / Law) -->
    <path d="M 256 108 L 268 124 L 256 140 L 244 124 Z" fill="url(#primaryBlue)"/>

    <!-- 9. Central Fulcrum Core (Blue Accent with White Center) -->
    <circle cx="256" cy="196" r="10" fill="#1E293B" stroke="url(#primaryBlue)" stroke-width="4"/>
    <circle cx="256" cy="196" r="4" fill="#FFFFFF"/>
  </g>
</svg>
